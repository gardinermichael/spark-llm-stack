# spark-gemma — Gemma-4-31B, alt reasoning with image input. HEAVYWEIGHT.
# See docker/compose.coder.yaml for the rationale behind every field here.

name: spark-gemma

services:
  gemma:
    image: spark-llm-stack
    container_name: spark-llm-gemma

    ports:
      - "127.0.0.1:8156:8156"

    gpus: all

    mem_limit: 80g
    memswap_limit: 80g
    mem_reservation: 70g
    oom_score_adj: 200
    shm_size: 1g
    ulimits:
      memlock: -1

    labels:
      spark.exclusive: "true"
      spark.stack: "llm"
      spark.slot: "gemma"
      spark.weight: "heavy"

    restart: "no"

    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}

    volumes:
      - type: bind
        source: ${MODELS_DIR:?set MODELS_DIR in docker/.env}
        target: /models

    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8156/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s

    # Verbatim from CMD_gemma, docker/docker-llm-switch:185-200. Identical in
    # shape to architect except the model, alias, --top-k 64 and
    # --presence-penalty 0.0.
    command:
      - -m
      - /models/gemma-4-31B-it-UD-Q4_K_XL.gguf
      - --alias
      - gemma4-31b
      - --host
      - 0.0.0.0
      - --port
      - "8156"
      - -ngl
      - "999"
      - -fa
      - "on"
      - -c
      - "131072"
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --kv-unified
      - --cache-ram
      - "49152"
      - --cache-idle-slots
      - --ctx-checkpoints
      - "64"
      - --cache-reuse
      - "1024"
      - -b
      - "16384"
      - -ub
      - "4096"
      - --parallel
      - "1"
      - --threads
      - "16"
      - --threads-batch
      - "24"
      - --threads-http
      - "4"
      - --prio
      - "2"
      - --poll
      - "50"
      - --reasoning
      - "on"
      - --reasoning-budget
      - "4000"
      - --reasoning-format
      - deepseek
      - --jinja
      - --temp
      - "1.0"
      - --top-k
      - "64"
      - --top-p
      - "0.95"
      - --min-p
      - "0.0"
      - --presence-penalty
      - "0.0"
      - --keep
      - "-1"
      - --metrics
      - --slots
