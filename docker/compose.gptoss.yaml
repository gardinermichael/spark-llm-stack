# spark-gptoss — GPT-OSS-20B, fast general. HEAVYWEIGHT.
# See docker/compose.coder.yaml for the rationale behind every field here.
#
# The only slot with no -m flag. --gpt-oss-20b-default makes llama.cpp fetch
# the weights from Hugging Face at runtime, which is why this slot alone
# mounts a cache and is the only consumer of HUGGING_FACE_HUB_TOKEN.
#
# The cache bind targets /root/.cache rather than a specific subdirectory:
# llama.cpp's download-cache location could not be confirmed from either
# `llama-server --help` or the binary in this image, so persisting the whole
# cache directory under the container's HOME catches it wherever it lands.
# Guessing a variable name would have produced a mount nothing writes to and a
# re-download on every recreate that looked like a network problem.

name: spark-gptoss

services:
  gptoss:
    image: spark-llm-stack
    container_name: spark-llm-gptoss

    ports:
      - "127.0.0.1:8157:8157"

    gpus: all

    mem_limit: 40g
    memswap_limit: 40g
    mem_reservation: 30g
    oom_score_adj: 200
    shm_size: 1g
    ulimits:
      memlock: -1

    labels:
      spark.exclusive: "true"
      spark.stack: "llm"
      spark.slot: "gptoss"
      spark.weight: "heavy"

    restart: "no"

    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}

    volumes:
      - type: bind
        source: ${MODELS_DIR:?set MODELS_DIR in docker/.env}
        target: /models
      - type: bind
        source: ${GPTOSS_CACHE_DIR:?set GPTOSS_CACHE_DIR in docker/.env}
        target: /root/.cache

    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8157/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Longer than the other llama slots: a cold cache downloads the weights
      # before the server can answer anything.
      start_period: 600s

    # Verbatim from CMD_gptoss, docker/docker-llm-switch:217-230.
    command:
      - --gpt-oss-20b-default
      - --alias
      - gpt-oss-20b
      - --host
      - 0.0.0.0
      - --port
      - "8157"
      - -ngl
      - "999"
      - -fa
      - "on"
      - -c
      - "131072"
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --kv-unified
      - --cache-ram
      - "16384"
      - --cache-idle-slots
      - --cache-reuse
      - "512"
      - -b
      - "16384"
      - -ub
      - "4096"
      - --parallel
      - "1"
      - --threads
      - "16"
      - --threads-batch
      - "24"
      - --threads-http
      - "4"
      - --prio
      - "2"
      - --poll
      - "50"
      - --jinja
      - --temp
      - "0.7"
      - --top-k
      - "40"
      - --top-p
      - "0.95"
      - --min-p
      - "0.0"
      - --keep
      - "-1"
      - --metrics
      - --slots
